# 每次 push / PR 跑一遍类型检查 + 单元测试 + i18n 完整性。
#
# 为什么需要:此前仓库只有 desktop-release.yml(打 tag 才跑),日常
# 提交没有任何自动检查 —— 类型错误、测试红、某个语言漏 key 都得等到
# 本地 `npm run release` 打包时才发现(release.sh 会因此中止),很容易
# 在「要发版了」的时候才炸。
#
# 只跑不需要数据库的检查:typecheck / vitest / i18n:check。集成测试要
# PostgreSQL,留给本地和 release 流程。

name: CI

on:
  push:
    branches: [main]
    # 客户端源码和文档不影响服务端检查,跳过以省时间
    paths-ignore:
      - "apps/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        # npm run（不是 npx):npx 在 node_modules 里找不到 tsc 时会去
        # 下载 npm 上一个同名的无关包 —— 本地就撞见过一次,它只会打印
        # "This is not the tsc command you are looking for" 然后退出 0,
        # 于是类型错误被静默放过。npm run 只认本地 bin。
        #
        # 这一条现在同时检查 src/ + scripts/ 和 test/(见 tsconfig.test.json)。
        # 以前 test/ 不在类型检查范围内:集成测试的调用方没跟上源码的签名改动,
        # typecheck 干净通过,要等 npm run test:int 才炸。
        run: npm run typecheck

      - name: Unit tests
        # env.ts 对必填项做 zod 校验,缺了就 process.exit(1) —— CI 里没有
        # .env,所以喂一组假值让模块能 import。这些测试不连数据库,
        # DATABASE_URL 只需格式合法。
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          SESSION_SECRET: ci-only-secret-not-used-anywhere-0123456789
          PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm test

      # 集成测试(进程内 PGlite,不需要外部数据库)。
      #
      # 这一步以前不在 CI 里,而**这个仓库里风险最高的那批断言全在它里面**:
      # 两条数据迁移(全天提醒档位改写、逼客户端重新同步)、账号被冒名认领的判定、
      # 建号配额的并发、CalDAV 删提醒的口径、存量事件在网页上保存不再 400。
      # 少了它,以后改坏这些东西的人会拿到一个全绿的 CI,而前面所有
      # 「故意改坏验它会变红」的工作在下一次改动时就等于没做过。
      #
      # 它和单元测试是两套 vitest 配置,npm test 不会连带跑到。
      - name: Integration tests
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          SESSION_SECRET: ci-only-secret-not-used-anywhere-0123456789
          PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm run test:int

      # 语言包完整性:任一语言缺 key(或者 key 在、值是空白)都会在这里挡下来,
      # 而不是等用户切到该语言看到一句英文、或者一个没有字的按钮。
      #
      # 这一步以前是**永远不会失败**的,两层叠在一起:
      #   - `npm run i18n:check || true` 再加 continue-on-error,就算脚本红了
      #     这一步也绿;
      #   - 脚本自己不带 --min-coverage 时阈值取 0,本来也永远退 0。
      # 两层都拆了:脚本默认要求 100%(理由写在 scripts/i18n-coverage.ts 头上),
      # 这里也不再吞它的退出码。之前欠的 18 个键(6 门语言 × adminUpdate.upload.*)
      # 已经补齐,八门语言现在都是 1277/1277。
      - name: i18n completeness
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          SESSION_SECRET: ci-only-secret-not-used-anywhere-0123456789
          PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: npm run i18n:check
