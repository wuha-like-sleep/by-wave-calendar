name: Desktop release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Choose the platform to build. Cloud builds consume Actions minutes."
        required: true
        default: windows
        type: choice
        options: [windows, mac-arm64, mac-intel, linux, all]
      tag:
        description: "Optional desktop-vX.Y.Z tag. Leave empty to build installers only."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'windows' && '[{"os":"windows-latest","arch":"x64","target":"packageBrandedMsi"}]' ||
            inputs.platform == 'mac-arm64' && '[{"os":"macos-15","arch":"arm64","target":"packageBrandedDmg"}]' ||
            inputs.platform == 'mac-intel' && '[{"os":"macos-15-intel","arch":"x64","target":"packageBrandedDmg"}]' ||
            inputs.platform == 'linux' && '[{"os":"ubuntu-latest","arch":"x64","target":"packageDeb"}]' ||
            '[{"os":"windows-latest","arch":"x64","target":"packageBrandedMsi"},{"os":"macos-15","arch":"arm64","target":"packageBrandedDmg"},{"os":"macos-15-intel","arch":"x64","target":"packageBrandedDmg"},{"os":"ubuntu-latest","arch":"x64","target":"packageDeb"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - name: Import optional Apple signing certificate
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERT_P12_BASE64 != ''
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/bywave-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/bywave-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/bywave-cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/bywave-cert.p12"
      - name: Test and build native installer
        working-directory: apps/desktop
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_DEVELOPER_ID_APPLICATION" ]; then unset APPLE_DEVELOPER_ID_APPLICATION; fi
          ./gradlew test "$BUILD_TARGET" --no-daemon
      - name: Notarize and staple when credentials are configured
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERT_P12_BASE64 != ''
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$APPLE_NOTARY_APPLE_ID" ] && [ -n "$APPLE_NOTARY_PASSWORD" ] && [ -n "$APPLE_NOTARY_TEAM_ID" ]; then
            for file in apps/desktop/build/compose/binaries/main/dmg/*.dmg; do
              xcrun notarytool submit "$file" --apple-id "$APPLE_NOTARY_APPLE_ID" --password "$APPLE_NOTARY_PASSWORD" --team-id "$APPLE_NOTARY_TEAM_ID" --wait
              xcrun stapler staple "$file"
              xcrun stapler validate "$file"
            done
          fi
      - name: Name architecture-specific installers
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for p in Path('apps/desktop/build/compose/binaries/main').rglob('*'):
              if p.suffix in ('.dmg', '.msi'):
                  p.rename(p.with_name(f'{p.stem}-{os.environ["BUILD_ARCH"]}{p.suffix}'))
          PY
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            apps/desktop/build/compose/binaries/main/**/*.dmg
            apps/desktop/build/compose/binaries/main/**/*.msi
            apps/desktop/build/compose/binaries/main/**/*.deb
          if-no-files-found: error
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.os }}
          path: |
            apps/desktop/build/compose/logs/**
            apps/desktop/build/reports/tests/**
      - name: Remove temporary signing keychain
        if: always() && startsWith(matrix.os, 'macos') && env.APPLE_CERT_P12_BASE64 != ''
        run: security delete-keychain "$RUNNER_TEMP/bywave-build.keychain-db" || true

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          BUILD_PLATFORM: ${{ inputs.platform }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' apps/desktop/build.gradle.kts)
          if [[ ! "$TAG" =~ ^desktop-v[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || [ "$TAG" != "desktop-v$VERSION" ]; then
            echo "Release tag must match the installer version" >&2; exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = false ]; then
              echo "Published assets are immutable; keeping their existing checksums."; exit 0
            fi
          else
            gh release create "$TAG" --target "$COMMIT_SHA" --title "桌面端 v$VERSION" --notes-file apps/desktop/RELEASE_NOTES.md --draft
          fi
          SUM_FILE="dist/SHA256SUMS-${BUILD_PLATFORM}.txt"
          find dist -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" \) -exec sha256sum {} + > "$SUM_FILE"
          # Never silently replace an artifact referenced by a published manifest.
          shopt -s nullglob
          gh release upload "$TAG" dist/*.dmg dist/*.msi dist/*.deb "$SUM_FILE"
