# Cross-platform desktop release builds.
#
# Triggers on tag push matching desktop-v* (e.g. desktop-v0.7.0). The
# matrix produces:
#   - macos-13   (Intel runner) → ByWaveCalendar-<v>.dmg
#   - macos-14   (Apple Silicon runner) → ByWaveCalendar-<v>-arm64.dmg
#   - windows-latest → ByWaveCalendar-<v>.msi
#   - ubuntu-latest → bywave-calendar_<v>-1_amd64.deb
#
# All artifacts get uploaded to the matching GitHub Release. Signing
# is opt-in via repo secrets — without APPLE_DEVELOPER_ID_APPLICATION
# the Mac DMG ships unsigned (Gatekeeper warns, user right-clicks →
# Open to bypass). MSI on Windows is similarly unsigned until we have
# an EV Code Signing cert (~$400/yr; deferred to v1.0).
#
# Manual trigger via workflow_dispatch is also supported for testing
# without cutting a tag.

name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to attach artifacts to (e.g. desktop-v0.7.0). Skip to dry-run without uploading."
        required: false
        type: string

permissions:
  contents: write   # needed for gh release upload

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
            target: packageDmg
            artifact: "**/*.dmg"
          - os: macos-14
            arch: arm64
            target: packageDmg
            artifact: "**/*.dmg"
          - os: windows-latest
            arch: x64
            target: packageMsi
            artifact: "**/*.msi"
          - os: ubuntu-latest
            arch: x64
            target: packageDeb
            artifact: "**/*.deb"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Temurin 21 — full JDK (with jpackage). Android Studio's JBR
      # would not work here because it strips jpackage.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build native installer
        working-directory: apps/desktop
        run: ./gradlew ${{ matrix.target }} --no-daemon

      # When jpackage fails it dumps the real error to a file we can't
      # otherwise see — cat it into the workflow log so debugging doesn't
      # require SSH-ing into the runner. Cross-platform shell since the
      # logs path is the same shape on macOS / Linux / Windows.
      - name: Dump jpackage logs on failure
        if: failure()
        shell: bash
        working-directory: apps/desktop
        run: |
          echo "=== Listing build/compose/logs/ ==="
          ls -la build/compose/logs/ 2>/dev/null || echo "(no logs dir)"
          find build/compose/logs -type f -name "*.txt" 2>/dev/null | while read -r f; do
            echo ""
            echo "=== $f ==="
            cat "$f"
          done

      # Mac signing — only runs when APPLE_DEVELOPER_ID_APPLICATION
      # is set. Without it the DMG ships unsigned (the Gradle plugin
      # already gates signing on the env var; this block is just for
      # passing the cert through to keychain).
      - name: Import Apple signing cert
        if: startsWith(matrix.os, 'macos') && env.APPLE_CERT_P12_BASE64 != ''
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

      - name: Rename ARM Mac artifact
        if: matrix.os == 'macos-14'
        working-directory: apps/desktop/build/compose/binaries/main/dmg
        # ARM build lives in the same dir as Intel build by default; add
        # -arm64 suffix so Release page differentiates them.
        run: |
          for f in *.dmg; do
            base="${f%.dmg}"
            mv "$f" "${base}-arm64.dmg"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/desktop/build/compose/binaries/main/**/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    # Only attach to a Release when we're actually building for a tag
    # (push or workflow_dispatch with an explicit tag input).
    if: startsWith(github.ref, 'refs/tags/desktop-v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Compute sha256
        run: |
          find dist -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" \) \
            -exec shasum -a 256 {} \; | tee dist/SHA256SUMS.txt
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          # Create the release if it doesn't exist yet.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Desktop $TAG" \
              --notes "Desktop client release $TAG. See apps/desktop/CHANGELOG.md for highlights." \
              --draft
          # Upload every artifact under dist/. --clobber lets us re-run
          # the release on a re-tag without manual cleanup.
          find dist -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "SHA256SUMS.txt" \) \
            -exec gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber {} +
