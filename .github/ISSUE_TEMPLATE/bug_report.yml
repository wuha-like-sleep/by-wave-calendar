name: Bug 报告 / Bug report
description: 功能不对、报错、崩溃 / Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。**安全漏洞请不要在这里提** —— 见 [SECURITY.md](../blob/main/SECURITY.md)。
        Please do not report security issues here.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 你做了什么、期望什么、实际发生了什么
      placeholder: |
        1. 在网页端创建了一个重复事件
        2. 期望 iPhone 上也能看到
        3. 实际上 iPhone 只显示第一次
    validations: { required: true }
  - type: input
    id: server
    attributes:
      label: 服务端版本 / Server version
      description: 访问 `https://你的域名/health` 可以看到
      placeholder: "1.6.10"
    validations: { required: true }
  - type: dropdown
    id: client
    attributes:
      label: 哪个客户端 / Which client
      multiple: true
      options: [网页 Web, iOS, Android, macOS, Windows, Linux, CalDAV（Apple 日历 / DAVx⁵ 等）, ICS 订阅]
    validations: { required: true }
  - type: input
    id: client_version
    attributes:
      label: 客户端版本 / Client version
      placeholder: "iOS 1.6.2 (22) / 桌面 1.0.17 / Chrome 150"
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图 / Logs or screenshots
      description: 服务端 `pm2 logs`、浏览器控制台报错、或截图。**贴之前请去掉密码、Token、邮箱等敏感信息。**
      render: shell
