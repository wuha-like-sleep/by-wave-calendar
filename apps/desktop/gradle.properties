# Compose Multiplatform Desktop — needs G1GC + 2GB headroom for the
# Skiko renderer compile + JLink imageGraal builds.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Kotlin compiler. K2 is the new frontend, stable since Kotlin 2.0.
kotlin.code.style=official

# Compose Multiplatform requires this for its incremental compiler.
org.gradle.parallel=true
org.gradle.caching=true
