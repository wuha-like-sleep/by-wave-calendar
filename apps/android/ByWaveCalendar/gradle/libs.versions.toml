# Central version catalog. One place to bump every dependency we use
# across the project (currently just :app, but kept here so a future
# split into :data + :ui doesn't fork the versions).
#
# Conventions:
#   - Bump conservatively. Compose BOM controls all compose-* versions
#     simultaneously so we don't fight transitive mismatches.
#   - Match what Android Studio recommends in the "New Compose Project"
#     template so first-time builds don't trip on Gradle/Kotlin/AGP
#     compatibility gotchas.

[versions]
agp = "8.5.2"
kotlin = "2.0.20"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.6"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigationCompose = "2.8.3"
material3 = "1.3.0"
material3WindowSize = "1.3.0"
material = "1.7.4"
retrofit = "2.11.0"
okhttp = "4.12.0"
# Retrofit 2.11+ ships its own kotlinx-serialization converter under
# com.squareup.retrofit2 — kept at the same version as retrofit itself.
# (The older JakeWharton converter at 1.0.0 doesn't export asConverterFactory.)
retrofitKotlinxSerialization = "2.11.0"
room = "2.6.1"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
cameraX = "1.3.4"
mlKitBarcode = "17.3.0"
ksp = "2.0.20-1.0.25"

[libraries]
androidx-core-ktx           = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose   = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Compose
compose-bom                 = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui                  = { module = "androidx.compose.ui:ui" }
compose-ui-graphics         = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling          = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview  = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3           = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material3-window    = { module = "androidx.compose.material3:material3-window-size-class", version.ref = "material3WindowSize" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material" }

# Coroutines
kotlinx-coroutines-core     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

# Serialization
kotlinx-serialization-json  = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Network
retrofit                    = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofitKotlinxSerialization" }
okhttp                      = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging              = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }

# Persistence
androidx-room-runtime       = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx           = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler      = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-datastore          = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto    = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }

# CameraX + ML Kit for QR scanning
androidx-camera-core        = { module = "androidx.camera:camera-core", version.ref = "cameraX" }
androidx-camera-camera2     = { module = "androidx.camera:camera-camera2", version.ref = "cameraX" }
androidx-camera-lifecycle   = { module = "androidx.camera:camera-lifecycle", version.ref = "cameraX" }
androidx-camera-view        = { module = "androidx.camera:camera-view", version.ref = "cameraX" }
mlkit-barcode-scanning      = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlKitBarcode" }

[plugins]
android-application     = { id = "com.android.application", version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp", version.ref = "ksp" }
