# Project-wide Gradle settings.

# JVM heap for Gradle itself. 4G is comfortable for AGP 8.x + Compose
# compiler running KSP + Room codegen without OOM-killing on M-series
# Macs with 16GB RAM.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Build configuration.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX migration (mandatory for new projects since AGP 7).
android.useAndroidX=true

# Kotlin code style for IDE conventions.
kotlin.code.style=official

# Disable non-transitive R class warning — we use a single :app module
# so transitive is fine.
android.nonTransitiveRClass=true
